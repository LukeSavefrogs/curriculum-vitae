          - Utilizzo di C# per sviluppare un software ETL per importare i listini prezzi Excel dei fornitori nel database aziendale e per sincronizzare gli appuntamenti tra il calendario interno e Outlook
          - Attività di base di help desk IT, tra cui risoluzione di problemi hardware e software, supporto agli utenti e manutenzione della rete
      
      - company: Re-Edit S.r.l.
        position: Operatore mainframe IBM z/TPF
        start_date: 2018-11
        end_date: 2020-02
        location: Roma, Italia
        summary: Operatore mainframe per il sistema IBM z/TPF di Trenitalia
        highlights:
          - Lavoro su turni di 8 ore (incluse notti e weekend) per garantire una copertura 24/7
          - Monitoraggio e gestione del sistema IBM z/TPF, garantendone il regolare funzionamento e le prestazioni
          - Gestione degli avvisi di sistema, attività di manutenzione ordinaria (recoup, backup su nastro) e risposta a incident per minimizzare i tempi di inattività
          - Attività di build, deploy e rollback dell'applicazione di prenotazione posti sugli ambienti di produzione e non produzione
          - Gestione dei backup di sistema (multipli OS) tramite Tivoli Storage Manager (TSM)
      
      - company: Re-Edit S.r.l.
        position: Operatore IBM DB2
        start_date: 2020-01
        end_date: 2021-02
        location: Roma, Italia
        summary: Operatore database per Trenitalia
        highlights:
          - Lavoro su turni di 8 ore (incluse notti e weekend) per garantire una copertura 24/7
