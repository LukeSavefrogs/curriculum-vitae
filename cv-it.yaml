    progetti:
      - name: "[setup-jython](https://github.com/LukeSavefrogs/setup-jython)"
        date:
        start_date: 2023-05
        end_date: present
        location:
        summary: GitHub Action per configurare Jython nei workflow GitHub
        highlights:
          - GitHub Action di facile utilizzo per installare e configurare interpreti Jython nelle pipeline CI/CD
          - Accetta gli stessi parametri della GitHub Action [`setup-python`](https://github.com/actions/setup-python),
            rendendola immediata da utilizzare
          - Supporta tutte le versioni di Jython dalla 2.0 alla 2.7.3, su runner Windows, Linux e macOS

      - name: "[jython21-backport](https://github.com/LukeSavefrogs/jython21-backport)"
        date:
        start_date: 2023-05
        end_date: present
        location:
        summary: Backport di funzionalità Python moderne per versioni legacy di Jython (fino alla 2.1)
        highlights:
          - Supporto per interpreti sia CPython che Jython fino alla versione 2.1
          - Retrocompatibilità garantita tramite test automatici su molteplici versioni di Jython e CPython (su diversi
            sistemi operativi) tramite GitHub Actions
          - >
            Le funzionalità implementate includono: 
            modulo `json` (Python >= 2.6), classe `pathlib.Path` (Python >= 3.4), classe `bool` (Python >= 2.3),
            funzione `sorted` (Python >= 2.4)

      - name: "[column-ansi](https://github.com/LukeSavefrogs/column_ansi)"
        date:
        start_date: 2021-12
        end_date: present
        location:
        summary: Implementazione parziale in Perl del comando shell `column`
        highlights:
          - Formatta l'input in colonne multiple, simile al comando Unix `column`, con supporto ai codici colore ANSI
          - Scritto in Perl, risultando facilmente portabile e utilizzabile in diversi ambienti
          - Test automatici tramite GitHub Actions per garantire affidabilità e correttezza (utilizzando
            [Shellcheck](https://github.com/shellspec/shellspec) come framework di unit test)

