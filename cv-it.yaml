  sections:
    biografia:
      - Sono uno sviluppatore software e Open Source enthusiast, con una forte inclinazione per l'automazione di attività ripetitive e l'ottimizzazione dei flussi di lavoro.
      - Ho una forte passione per l'apprendimento di nuove tecnologie, che mi ha portato a esplorare diversi linguaggi di programmazione e framework.
