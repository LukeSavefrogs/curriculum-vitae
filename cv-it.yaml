          - Esecuzione di script DML/DDL
      
      - company: Re-Edit S.r.l.
        position: Operatore IBM WebSphere Application Server
        start_date: 2021-02
        end_date: 2022-06
        location: Roma, Italia
        summary: Operatore WebSphere Application Server per Trenitalia
        highlights:
          - Lavoro su turni di 8 ore (incluse notti e weekend) per garantire una copertura 24/7
          - Monitoraggio e gestione di celle WAS, server LDAP e MQ di produzione e non produzione
          - Attività di base di amministrazione Linux relative a WAS, quali gestione utenti, monitoraggio e gestione dello spazio su disco
          - Gestione di ticket e incident, fornendo soluzioni rapide per ridurre al minimo i tempi di inattività
          - Esecuzione di attività di manutenzione ordinaria, tra cui deployment applicativi, riavvii dei server e analisi/risoluzione dei problemi dai log
          - Sviluppo e manutenzione di script (Bash, Jython, Perl) per automatizzare attività comuni, migliorando l'efficienza e riducendo gli errori
          - Sviluppo di uno strumento interno in JavaScript per automatizzare il sistema di ticketing, riducendo il lavoro manuale
          - Sviluppo e manutenzione di script Python per automatizzare test end-to-end di applicazioni web, migliorando l'affidabilità e riducendo il carico di testing manuale
      
      - company: Re-Edit S.r.l.
        position: Business Monitoring
        start_date: 2022-06
        end_date: 2022-11
        location: Roma, Italia
        summary: Business Monitoring per Generali
        highlights:
          - Utilizzo di Microfocus Application Performance Management (APM) per monitorare processi aziendali e applicazioni
          - Manutenzione e aggiornamento di script di monitoraggio per garantire una raccolta e un'analisi accurata dei dati

      - company: Re-Edit S.r.l.
        position: Automation developer
        start_date: 2024-04
        end_date: 2024-09
        location: Roma, Italia
        summary: Analisi dispositivi di rete CISCO per IPZS
        highlights:
          - Sviluppo di script Perl per automatizzare il recupero dei dati da numerosi dispositivi di rete CISCO
          - Test automatici degli script tramite GitHub Actions, garantendo affidabilità e correttezza tra le release

      - company: Re-Edit S.r.l.
        position: Automation developer
        start_date: 2022-12
        end_date: present
        location: Roma, Italia
        summary: Sviluppatore Java per Unicredit
        highlights:
          - Manutenzione, modernizzazione e sviluppo di nuove funzionalità per complesse applicazioni interne legacy in Java 8, utilizzate per automatizzare il provisioning dei server, attività di configurazione e processi di health-check
          - Sviluppo e manutenzione di script di automazione (Bash, Python, Perl) per supportare varie attività operative IT
          - Sviluppo e manutenzione di script Jython (*Jython v2.1*) per automatizzare attività di amministrazione WebSphere Application Server (*che ha portato alla creazione di [jython21-backport](https://github.com/LukeSavefrogs/jython21-backport) per una migliore esperienza di sviluppo*)
          - Utilizzo di Ansible Automation Platform per integrare strumenti di automazione esistenti e semplificare i processi operativi IT
          - Manutenzione di strumenti di build interni basati su Apache Maven, pipeline CI/CD Jenkins e GitHub Actions
          - Utilizzo di Git per il versionamento e GitHub Issues/GitHub Projects per la coordinazione delle attività e la collaborazione del team

    progetti:
      - name: '[setup-jython](https://github.com/LukeSavefrogs/setup-jython)'
        date:
        start_date: 2023-05
        end_date: present
        location:
        summary: GitHub Action per configurare Jython nei workflow GitHub
        highlights:
          - GitHub Action di facile utilizzo per installare e configurare interpreti Jython nelle pipeline CI/CD
          - Accetta gli stessi parametri della GitHub Action [`setup-python`](https://github.com/actions/setup-python), rendendola immediata da utilizzare
          - Supporta tutte le versioni di Jython dalla 2.0 alla 2.7.3, su runner Windows, Linux e macOS

      - name: '[jython21-backport](https://github.com/LukeSavefrogs/jython21-backport)'
        date:
        start_date: 2023-05
        end_date: present
        location:
        summary: Backport di funzionalità Python moderne per versioni legacy di Jython (fino alla 2.1)
        highlights:
          - Supporto per interpreti sia CPython che Jython fino alla versione 2.1
          - Retrocompatibilità garantita tramite test automatici su molteplici versioni di Jython e CPython (su diversi sistemi operativi) tramite GitHub Actions
          - |
            Le funzionalità implementate includono: 
            - implementazione personalizzata del modulo `json` (introdotto in Python 2.6)
            - classe `pathlib.Path` (introdotta in Python 3.4)
            - tipo `bool` (introdotto in Python 2.3)
            - `sorted` (introdotto in Python 2.4)

      - name: '[column-ansi](https://github.com/LukeSavefrogs/column_ansi)'
        date:
        start_date: 2021-12
        end_date: present
        location:
        summary: Implementazione parziale in Perl del comando shell `column`
        highlights:
          - Formatta l'input in colonne multiple, simile al comando Unix `column`, con supporto ai codici colore ANSI
          - Scritto in Perl, risultando facilmente portabile e utilizzabile in diversi ambienti
          - Test automatici tramite GitHub Actions per garantire affidabilità e correttezza (utilizzando Shellcheck come framework di unit test)

    competenze:
      - label: Programmazione
        details: Utilizzo regolare di Python, Java e Git; conoscenza operativa di PHP, JavaScript, SQL, HTML/CSS e linguaggi di scripting (Bash, Perl)
      - label: Lingue
        details: 'Italiano (madrelingua), Inglese (B2-C1)'
    
    certificazioni:
