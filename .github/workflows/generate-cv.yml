name: Generate CV artifacts

on:
  workflow_dispatch:
    inputs:
      cv-version:
        description: Version shown in the top-right corner of the CV (followed by the commit SHA). Defaults to 'dev'.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      cv-version:
        description: Version shown in the top-right corner of the CV (followed by the commit SHA). Defaults to 'dev'.
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Generate CV
        env:
          CV_VERSION: ${{ inputs.cv-version }}
        run: |
          ./scripts/build_cv.sh

      - name: Upload CV artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-cv
          path: build/**/*
          if-no-files-found: error
