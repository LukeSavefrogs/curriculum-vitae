name: Release new CV version

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"

jobs:
  # Computed before generating the CV so that the version printed on the PDF matches the release tag
  version:
    runs-on: ubuntu-latest
    outputs:
      cv-version: ${{ steps.version.outputs.CV_VERSION }}
    steps:
      - name: Generate version tag
        id: version
        shell: bash
        run: |
          cv_version="$(date +'cv-%Y.%m.%d-%H.%M.%S')"
          echo "CV_VERSION=$cv_version" >> $GITHUB_OUTPUT

  generate-cv:
    needs: [version]
    uses: ./.github/workflows/generate-cv.yml
    with:
      cv-version: ${{ needs.version.outputs.cv-version }}

  create-release:
    runs-on: ubuntu-latest
    needs: [version, generate-cv]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download CV artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-cv
          path: build/lang/

      - name: Rename CV files for release
        run: |
          mkdir -p build/release/
          for file in build/lang/**/*.pdf; do
            filename="$(basename "$file")"
            lang="$(basename "$(dirname "$file")")"
            new_filename="${filename%.pdf}-${lang}.pdf"

            cp "$file" "build/release/${new_filename}"
          done

      - name: Prepare release notes
        id: version
        shell: bash
        env:
          CV_VERSION: ${{ needs.version.outputs.cv-version }}
        run: |
          cv_version="${CV_VERSION:?Missing CV version}"
          echo "CV_VERSION=$cv_version" >> $GITHUB_OUTPUT

          (
            delimiter="$(tr -dc A-Za-z0-9 </dev/urandom 2>/dev/null | head -c 64)" || true
            echo "GENERATED_FILES_TABLE<<${delimiter}"
            echo "| Language | File Name |"
            echo "|----------|-----------|"
            for file in build/release/*.pdf; do
              filename="$(basename "$file")"
              lang="${filename##*-}"
              lang="${lang%.pdf}"

              download_base_url="${{ env.GITHUB_REPOSITORY_URL }}/releases/download/$cv_version"
              echo "| ${lang} | [${filename}](${download_base_url}/${filename}) |"
            done
            echo "$delimiter"
          ) >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.CV_VERSION }}
          name: ${{ steps.version.outputs.CV_VERSION }}
          body: |
            # `${{ steps.version.outputs.CV_VERSION }}`

            This is an automated release of the CV generated from the latest commit on the main branch.

            ## Generated files

            ${{ steps.version.outputs.GENERATED_FILES_TABLE }}

            <sub>
              <a href="${{ env.GITHUB_REPOSITORY_URL }}/releases/latest">
                Go to latest CV release
              </a>
            </sub>
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            build/release/*.pdf

      - name: Add summary message
        run: |
          cat <<-EOF >> $GITHUB_STEP_SUMMARY
          # New CV Release Created
          A new CV version has been released: **${{ steps.version.outputs.CV_VERSION }}**

          You can download the generated CV files from the [Releases](${{ env.GITHUB_REPOSITORY_URL }}/releases/tag/${{ steps.version.outputs.CV_VERSION }})

          ## Generated files

          ${{ steps.version.outputs.GENERATED_FILES_TABLE }}

  gh-pages:
    runs-on: ubuntu-latest
    # After the release, so the "Download PDF" link (latest release) already points to the new CV
    needs: [version, create-release]

    permissions:
      contents: read # to checkout the repository
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Build website
        env:
          CV_VERSION: ${{ needs.version.outputs.cv-version }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifacts for Github Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
